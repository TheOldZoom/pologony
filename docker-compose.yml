services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PORT: ${PORT:-3000}
      POLOGONY_LICHESS: ${POLOGONY_LICHESS:-on}
    volumes:
      - puzzles:/var/cache/pologony
    ports:
      - '${APP_BIND:-0.0.0.0}:${APP_PORT:-${PORT:-3000}}:${PORT:-3000}'
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:" + process.env.PORT + "/").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 5

volumes:
  puzzles:
